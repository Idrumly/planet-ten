name: Puzzle checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node puzzle-contracts.test.js
      - run: node farm-contracts.test.js
      - run: node --test training.test.js
      - run: node --test orientation.test.js
      - run: node --test alien-voice.test.js
      - run: node --test voice-effects.test.js
      - run: node --test block-field.test.js
      - run: node --test super-model.test.js

      - run: node --test rounding-model.test.js rounding-hints.test.js warehouse-wing.test.js review-rounding.test.js
      - run: node --test spelling-bee.test.js
      - run: node --test auditorium.test.js
      - run: node --test lock-gag-model.test.js
