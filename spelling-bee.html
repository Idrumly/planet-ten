<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Planet Ten: The Spelling Bee's Journey is under development. A spelling adventure for students is coming soon.">
  <title>Planet Ten: The Spelling Bee's Journey</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background: radial-gradient(ellipse at top, #24395b, #101b30 75%);
      color: #fff7e5;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 46rem; }
    .bee { margin: 0 0 1.5rem; font-size: 4rem; }
    .eyebrow { color: #f5ca69; font-size: 1rem; font-weight: 700; letter-spacing: .2em; }
    h1 { margin: 1rem 0 1.5rem; font-size: clamp(2rem, 6vw, 3.75rem); line-height: 1.15; }
    .status { display: inline-block; margin: 0; padding: .65rem 1.25rem; border: 1px solid #f5ca69; border-radius: 2rem; color: #f5ca69; font-size: 1.25rem; font-weight: 650; }
    .message { margin: 1.5rem auto 0; max-width: 32rem; color: #d2deec; font-size: 1.125rem; line-height: 1.7; }
    a { display: inline-block; margin-top: 2.5rem; padding: .75rem; color: #d2deec; text-underline-offset: .25em; }
    a:hover { color: #f5ca69; }
    a:focus-visible { outline: 3px solid #f5ca69; outline-offset: 4px; border-radius: .25rem; }
  </style>
</head>
<body>
  <main>
    <p class="bee" aria-hidden="true">🐝</p>
    <p class="eyebrow">STUDENT LANDING</p>
    <h1>Planet Ten:<br>The Spelling Bee's Journey</h1>
    <p class="status">Under development</p>
    <p class="message">A spelling adventure for students is coming soon.<br>Check back for the beginning of the journey!</p>
    <a href="./">Explore Planet Ten</a>
  </main>
</body>
</html>
